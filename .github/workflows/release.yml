name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a dry run (builds the DMG as an artifact, publishes nothing)"
        default: "0.0.0-dryrun"

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      HAS_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        run: scripts/build-app.sh
      - name: Build DMG (notarized when credentials are set)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/make-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentBackup-${{ env.VERSION }}
          path: |
            build/AgentBackup-*.dmg
            build/AgentBackup-*.dmg.sha256

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$HAS_CERT" == "true" && "$HAS_NOTARY" == "true" ]]; then
            NOTE="Signed with Developer ID and notarized."
          else
            NOTE="⚠️ Not notarized yet (ad-hoc signed). After installing, right-click the app → Open, or run: xattr -dr com.apple.quarantine \"/Applications/Agent Backup.app\""
          fi
          gh release create "$GITHUB_REF_NAME" build/AgentBackup-*.dmg build/AgentBackup-*.dmg.sha256 \
            --title "Agent Backup $VERSION" --generate-notes --notes "$NOTE"
